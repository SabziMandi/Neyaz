<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neyaz Farooquee — reporting and production, South Asia</title>
<meta name="description" content="Reporting and production from India and South Asia. Business, politics and labour, in text and video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a18;
  --ink-2:#55534d;
  --ink-3:#6b6961;
  --paper:#ffffff;
  --tint:#f6f6f4;--tint-2:#fafaf8;
  --rule:#d8d5cc;
  --reported:#8f3a1c;
  --produced:#0f6e56;
  --serif:'Spectral',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --display:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:36px 28px 28px}
a{color:inherit;text-decoration:none}
a:hover .hl{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--reported);outline-offset:3px}
.mb{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.folio{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.flag{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.2vw,22px);margin:20px 0 10px}
.flag .nm{font-family:var(--display);font-size:clamp(32px,6.9vw,55px);font-weight:600;letter-spacing:-.028em;line-height:1}
.mono{width:44px;height:44px;border:1px solid var(--ink-3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:15px;flex:0 0 auto}
.slogan{text-align:center;font-style:italic;font-size:14px;color:var(--ink-2);margin-bottom:16px}
.strap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:10.5px;color:var(--ink-2);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 0;margin-bottom:28px}

.kicker{font-family:var(--sans);font-size:10px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}
.k-rep{color:var(--reported)}
.k-pro{color:var(--produced)}
.hed{font-weight:500;line-height:1.16;letter-spacing:-.01em}
.deck{color:var(--ink-2);line-height:1.68}
.photo{background:var(--rule);border-radius:2px;display:flex;align-items:flex-end}
.capline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:11px}
.capline .cap{font-family:var(--serif);font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.capline .crd{font-family:var(--sans);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;text-align:right}
.vid{background:#3d3b37;border-radius:2px;display:flex;align-items:center;justify-content:center;position:relative}
.vid .play{width:28px;height:28px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink)}
.vid .dur{position:absolute;bottom:5px;right:7px;font-family:var(--sans);font-size:10px;color:#dcd9d2}
.vid .ovc{position:absolute;bottom:5px;left:7px;font-family:var(--sans);font-size:9.5px;color:#cfccc5;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.meta{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-top:5px}

.top{display:grid;grid-template-columns:minmax(0,1.95fr) minmax(0,1fr);gap:28px;align-items:start}
.top .lead{border-right:1px solid var(--rule);padding-right:28px}
.lead .hed{font-family:var(--display);font-weight:600;font-size:clamp(25px,3.8vw,38px);line-height:1.08;letter-spacing:-.022em;margin-bottom:13px}
.lead .photo{height:300px;margin-bottom:9px}
.lead .deck{font-size:15px}
.railhead{font-family:var(--sans);font-size:10px;letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:14px;color:var(--produced)}
.railitem{margin-bottom:20px}
.railitem .vid{height:180px;margin-bottom:8px}
.railitem .hed{font-size:15px}
.rel-link{font-family:var(--sans);font-size:11px;color:var(--reported);margin-top:4px;display:inline-block;background:none;border:0;padding:0;cursor:pointer}

.row3{border-top:1px solid var(--ink);margin-top:28px;padding-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:24px}
.row3 .col{border-right:1px solid var(--rule);padding-right:22px}
.row3 .col:last-child{border-right:0;padding-right:0}
.row3 .hed{font-size:18px;margin-bottom:7px}
.row3 .deck{font-size:13px}

.adlabel{text-align:center;font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:7px}
.ad{border-top:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3);background:var(--tint);padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;font-family:var(--sans)}
.ad .bookcol{display:flex;flex-direction:column;align-items:center;gap:10px;width:104px}
.ad .cover{width:104px;height:150px;background:var(--rule);border:1px solid var(--ink-3);border-radius:2px;object-fit:cover;display:block}
.ad .buy{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;padding:8px 14px;font-size:12.5px;white-space:nowrap;display:inline-block;text-align:center;width:100%}
.ad .buy:hover{background:#000}
.ad .claim{font-family:var(--serif);font-size:17px;font-weight:400;font-style:italic;line-height:1.4;margin-bottom:8px}
.ad .src{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.ad .title{font-size:13px;font-weight:600;margin-bottom:5px}
.ad .body{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.ad .fine{font-size:12px;color:var(--ink-3);margin-top:9px}
.ad .cta{border:1px solid var(--ink);border-radius:4px;padding:10px 18px;font-size:13px;white-space:nowrap;display:inline-block}
.adslot{margin:30px 0 28px}

.mid{border-top:3px solid var(--ink);padding-top:22px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.mid .story{border-right:1px solid var(--rule);padding-right:28px}
.mid .story .hed{font-family:var(--display);font-weight:600;font-size:clamp(21px,2.7vw,26px);line-height:1.12;letter-spacing:-.02em;margin-bottom:11px}
.mid .story .vid{height:230px;margin-bottom:6px}
.role{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:9px;margin-bottom:16px}
.relhead{font-family:var(--sans);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.rel{display:flex;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--rule);margin-bottom:6px;align-items:baseline}
.rel:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
.rel .ic{font-family:var(--sans);font-size:9.5px;letter-spacing:.07em;color:var(--ink-3);flex:0 0 38px;text-transform:uppercase}
.rel .t{font-size:13px;line-height:1.3}
.rel .t.nolink{font-family:var(--sans);font-size:11.5px;line-height:1.45;color:var(--ink-3)}
.rel .meta{margin-top:2px}
.photo,.vid{background-size:cover;background-position:center}
.cred{font-family:var(--sans);font-size:10px;color:var(--ink-3);text-align:right;margin-bottom:11px}
.railitem .cred{margin-bottom:6px}
.relhead{margin-top:14px}
.railitem .relhead{border-bottom-width:1px;padding-bottom:5px;margin-bottom:8px}

.box{border:1px solid var(--ink);padding:15px 16px}
.boxhead{text-align:center;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:12px;font-size:16px;font-weight:500}
.brief{padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:10px}
.brief:last-of-type{border-bottom:0}
.brief .bh{font-family:var(--sans);font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:4px}
.brief .bt{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.brief .dl{color:var(--ink-3);font-family:var(--sans);font-size:10.5px;letter-spacing:.04em}
.fade{position:relative;max-height:78px;overflow:hidden}
.fade::after{content:'';position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--paper))}
.sub{border-top:1px solid var(--ink);margin-top:14px;padding-top:13px;text-align:center}
.sub .st{font-size:15px;margin-bottom:9px}
.sub .sb{border:1px solid var(--ink);border-radius:4px;padding:9px 16px;font-family:var(--sans);font-size:13px;display:inline-block}
.sub .sf{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-top:9px;line-height:1.5}

.arch{background:var(--tint-2);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:30px 0 0;padding:15px clamp(16px,2.4vw,26px) 17px}
.arch .ah{font-family:var(--sans);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);margin-bottom:11px}
.arch .row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding-bottom:9px;border-bottom:1px dotted var(--ink-3);margin-bottom:9px;align-items:baseline}
.arch .row:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
.arch .out{font-family:var(--sans);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);line-height:1.45}
.arch .t{font-size:14px;line-height:1.35;color:var(--ink)}
.promo{background:var(--tint);border-radius:4px;margin-top:28px;padding:18px 22px;font-family:var(--sans)}
.promo .ph{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:13px}
.promo .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px}
.promo .o{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--reported);margin-bottom:5px}
.promo .t{font-size:14px;font-weight:500;line-height:1.35}

.foot2{border-top:1px solid var(--ink);margin-top:28px;padding-top:20px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,0.5fr);gap:26px}
.soc{display:flex;justify-content:space-between;align-items:center;gap:10px}
body.editing .soc{flex-wrap:wrap;justify-content:flex-start;gap:16px}
.soc .row{display:flex;align-items:center;color:var(--ink-2)}
.soc .row:hover{color:var(--ink)}
.soc .row.off{color:var(--ink-3)}
.soc svg{width:20px;height:20px;flex:0 0 auto;fill:currentColor}
.foot2 .col{border-right:1px solid var(--rule);padding-right:24px}
.foot2 .col:last-child{border-right:0;padding-right:0}
.foot2 .h{font-family:var(--sans);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.foot2 .t{font-size:13px;line-height:1.7;color:var(--ink-2)}
.foot2 .attr{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-left:6px}
.foot2 .t{overflow-wrap:anywhere}
.ednote{display:block;margin-top:7px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.ednote b{font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-right:6px}

.colophon{border-top:1px solid var(--ink);margin-top:24px;padding-top:14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--sans);font-size:10.5px;color:var(--ink-3)}
.colophon nav{display:flex;gap:16px}
.disclaim{font-family:var(--sans);font-size:10px;color:var(--ink-3);line-height:1.6;margin-top:10px}

/* ---------- edit mode ---------- */
.editbtn{background:none;border:0;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);cursor:pointer;padding:0;text-decoration:underline}
body.editing .editable{position:relative;outline:1px dashed var(--rule);outline-offset:6px}
.ctl{display:none;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
body.editing .ctl{display:flex}
.ctl button{font-family:var(--sans);font-size:11px;padding:4px 9px;border:1px solid var(--rule);background:var(--paper);border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ctl button:hover{border-color:var(--ink);color:var(--ink)}
.bar{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:12.5px;padding:10px 16px;display:none;align-items:center;gap:12px;flex-wrap:wrap}
body.editing .bar{display:flex}
.bar button{font-family:var(--sans);font-size:12px;padding:5px 11px;border:1px solid #6b6862;background:none;color:var(--paper);border-radius:3px;cursor:pointer}
.bar button:hover{background:#2f2d2a}
.bar .sp{flex:1}
dialog{border:1px solid var(--ink);border-radius:4px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(26,26,24,.45)}
.dlg{padding:20px 22px;font-family:var(--sans)}
.dlg h2{font-family:var(--serif);font-size:19px;font-weight:500;margin:0 0 16px}
.dlg label{display:block;font-size:11.5px;color:var(--ink-2);margin:0 0 5px}
.dlg .f{margin-bottom:13px}
.dlg input,.dlg textarea,.dlg select{width:100%;font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.dlg textarea{resize:vertical;min-height:64px}
.dlg .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.dlg .actions button{font-size:13px;padding:8px 15px;border:1px solid var(--ink);background:none;border-radius:3px;cursor:pointer;color:var(--ink)}
.dlg .actions .primary{background:var(--ink);color:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:12.5px;padding:9px 16px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

@media (max-width:820px){
  .wrap{padding:24px 18px}
  .top,.mid{grid-template-columns:1fr;gap:24px}
  .top .lead,.mid .story{border-right:0;padding-right:0;border-bottom:1px solid var(--rule);padding-bottom:22px}
  .row3 .col{border-right:0;padding-right:0;border-bottom:1px solid var(--rule);padding-bottom:18px}
  .row3 .col:last-child{border-bottom:0;padding-bottom:0}
  .folio{font-size:10px}
  .strap{font-size:9.5px;gap:6px;flex-wrap:nowrap}
  .strap span{white-space:nowrap}

  .lead .photo{height:200px}
  .railitem .vid{height:200px}
  .mid .story .vid{height:200px}
  .arch{margin:24px 0 0;padding:14px 16px 16px}
  .arch .row{grid-template-columns:1fr;gap:3px}

  .ad{grid-template-columns:1fr;gap:18px}
  .ad>div:first-child{justify-self:center}
  .ad>div:last-child{justify-self:center;text-align:center}
  .ad .bookcol{width:128px}
  .ad .cta{padding:11px 26px}

  .dk{display:none}
  .mb{display:inline}
  .foot2{grid-template-columns:1fr;gap:0;border-top:1px solid var(--ink);padding-top:16px}
  .foot2 .col{border:0;padding:0}
  .foot2 .col+.col{border-top:1px solid var(--rule);margin-top:18px;padding-top:16px}
}
@media (max-width:400px){
  .strap{font-size:8.6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar" role="region" aria-label="Edit mode">
  <strong style="font-weight:500">Edit mode</strong>
  <span class="sp"></span>
  <button type="button" id="exp">Download data.json</button>
  <button type="button" id="imp">Load data.json</button>
  <button type="button" id="rst">Reset to saved</button>
  <button type="button" id="off">Done</button>
</div>

<div class="wrap">
  <h1 class="sr">Neyaz Farooquee — reporting and production, South Asia</h1>

  <div class="folio" id="folio"></div>

  <div class="flag editable" id="flag"></div>
  <div class="slogan" id="slogan"></div>
  <div class="ctl" data-ctl="masthead"><button type="button" data-act="edit-masthead">Edit masthead</button></div>

  <div class="strap" id="strap"></div>

  <div class="top">
    <div class="lead" id="lead"></div>
    <div>
      <div class="railhead">Watch &middot; Production</div>
      <div id="rail"></div>
      <div class="ctl"><button type="button" data-act="add" data-sec="watch">Add video</button></div>
    </div>
  </div>

  <div class="row3" id="row3"></div>
  <div class="ctl"><button type="button" data-act="add" data-sec="secondary">Add story</button></div>

  <div class="adslot">
    <div class="adlabel" id="adlabel"></div>
    <div class="ad editable" id="ad"></div>
    <div class="ctl"><button type="button" data-act="edit-ad">Edit advertisement</button></div>
  </div>

  <div class="mid">
    <div class="story" id="feature"></div>
    <div>
      <div class="box">
        <div class="boxhead">News in brief</div>
        <div id="briefs"></div>
        <div class="sub">
          <div class="st">Subscribe to read more</div>
          <a class="sb" href="contact.html">Continue &rarr;</a>
          <div class="sf">No charge, no newsletter</div>
        </div>
      </div>
      <div class="ctl"><button type="button" data-act="add" data-sec="briefs">Add brief</button></div>
    </div>
  </div>

  <div class="promo">
    <div class="ph" id="promohead"></div>
    <div class="grid" id="promo"></div>
  </div>
  <div class="ctl"><button type="button" data-act="add" data-sec="promo">Add byline</button><button type="button" data-act="edit-promohead">Rename box</button></div>

  <div class="foot2">
    <div class="col">
      <div class="h">[Course] corrections</div>
      <div id="corrections"></div>
      <div class="ctl"><button type="button" data-act="add" data-sec="corrections">Add step</button></div>
    </div>
    <div class="col">
      <div class="h">Letters to the editor</div>
      <div id="letters"></div>
      <div class="ctl"><button type="button" data-act="add" data-sec="letters">Add letter</button></div>
    </div>
    <div class="col">
      <div class="h">Elsewhere</div>
      <div class="soc" id="social"></div>
      <div class="ctl"><button type="button" data-act="add" data-sec="social">Add account</button></div>
    </div>
  </div>

  <div class="colophon">
    <span id="founded"></span>
    <nav><a href="contact.html" class="hl">Contact</a><a href="#" class="hl" id="archive">Archive</a></nav>
    <span>&copy; <span id="who"></span></span>
  </div>
</div>

<dialog id="dlg"><form method="dialog" class="dlg" id="form"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DEFAULT = {
  "masthead": {

  "lead": {

    "kicker": "Read · Reporting",

const KEY='nf-site-v1';

const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const v=window.localStorage.getItem(KEY);return v?JSON.parse(v):null; }catch(e){}
    return null;
  },
  async set(v){
    const s=JSON.stringify(v);
    try{ if(window.storage){await window.storage.set(KEY,s);return true;} }catch(e){}
    try{ window.localStorage.setItem(KEY,s);return true; }catch(e){}
    return false;
  }
};

function socIcon(k){
  const p=SOCIAL_ICONS[String(k||'').toLowerCase().trim()];
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(p||'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>')+'</svg>';
}
function relLine(r,sec,j,n){
  const t=r.url?'<a href="'+esc(r.url)+'"'+ext(r.url)+'><div class="t"><span class="hl">'+esc(r.title)+'</span></div></a>':'<div class="t nolink">'+esc(r.title)+'</div>';
  return '<div class="rel"><span class="ic">'+esc(r.type)+'</span><div style="min-width:0">'+t+(r.credit?'<div class="meta">'+esc(r.credit)+'</div>':'')+itemCtl(sec,j,n)+'</div></div>';
}
const bg=(u,pos)=>u?' style="background-image:url('+esc(u).replace(/\)/g,'%29')+');background-position:'+esc(pos||'center')+'"':'';
function itemCtl(sec,i,n){
  return '<div class="ctl"><button type="button" data-act="edit" data-sec="'+sec+'" data-i="'+i+'">Edit</button>'+
    (i>0?'<button type="button" data-act="up" data-sec="'+sec+'" data-i="'+i+'">Move up</button>':'')+
    (i<n-1?'<button type="button" data-act="down" data-sec="'+sec+'" data-i="'+i+'">Move down</button>':'')+
    '<button type="button" data-act="del" data-sec="'+sec+'" data-i="'+i+'">Delete</button></div>';
}

  archive:{outlet:'Outlet',title:'New story',url:''},
  corrections:{text:'New step'},
  letters:{text:'',attr:'',note:'',noteLink:'',noteUrl:'contact.html'},
  social:{platform:'x',handle:'@handle',url:''}
};
const get=p=>p.split('.').reduce((o,k)=>o[k],data);
const skey=p=>p.replace(/\.\d+\./g,'.');

function openForm(title,fields,obj,done){
  const f=$('form');
  f.innerHTML='<h2>'+esc(title)+'</h2>'+fields.map(([k,label,t])=>{
    const v=esc(obj[k]);
    if(t==='area')return '<div class="f"><label for="fd_'+k+'">'+esc(label)+'</label><textarea id="fd_'+k+'" name="'+k+'">'+v+'</textarea></div>';
    if(t==='select')return '<div class="f"><label for="fd_'+k+'">'+esc(label)+'</label><select id="fd_'+k+'" name="'+k+'"><option value="reported"'+(obj[k]==='reported'?' selected':'')+'>Reporting</option><option value="produced"'+(obj[k]==='produced'?' selected':'')+'>Production</option></select></div>';
    return '<div class="f"><label for="fd_'+k+'">'+esc(label)+'</label><input id="fd_'+k+'" name="'+k+'" value="'+v+'"></div>';
  }).join('')+'<div class="actions"><button type="button" value="cancel" id="cx">Cancel</button><button type="submit" class="primary">Save</button></div>';
  $('cx').onclick=()=>$('dlg').close();
  f.onsubmit=e=>{const fd=new FormData(f);fields.forEach(([k])=>obj[k]=fd.get(k));done&&done();save();};
  $('dlg').showModal();
}

async function save(){render();const ok=await store.set(data);toast(ok?'Saved':'Saved in this session only \u2014 use Download data.json');}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,sec=b.dataset.sec,i=+b.dataset.i;
  if(act==='edit-masthead')return openForm('Masthead',SCHEMA.masthead,data.masthead);
  if(act==='edit-ad')return openForm('Advertisement',SCHEMA.ad,data.ad);
  if(act==='edit-lead')return openForm('Lead story',SCHEMA.lead,data.lead);
  if(act==='edit-feature')return openForm('Feature video',SCHEMA.feature,data.feature);
  if(act==='edit-archivehead'){const o={archivehead:data.archivehead};return openForm('Box title',[['archivehead','Title']],o,()=>{data.archivehead=o.archivehead;});}
  if(act==='edit-promohead'){const o={promohead:data.promohead};return openForm('Box title',[['promohead','Title']],o,()=>{data.promohead=o.promohead;});}
  const arr=get(sec);
  if(act==='add'){const it=structuredClone(BLANK[skey(sec)]);arr.push(it);save();openForm('New entry',SCHEMA[skey(sec)],it);return;}
  if(act==='edit')return openForm('Edit entry',SCHEMA[skey(sec)],arr[i]);
  if(act==='del'){if(confirm('Delete this entry?')){arr.splice(i,1);save();}return;}
  if(act==='up'){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];save();return;}
  if(act==='down'){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];save();return;}
});

window.addEventListener('hashchange',()=>{if(location.hash==='#edit')document.body.classList.add('editing');});
$('off').onclick=()=>{document.body.classList.remove('editing');if(location.hash==='#edit')history.replaceState(null,'',location.pathname);};
$('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();
  toast('Downloaded \u2014 commit this next to index.html');
};
$('imp').onclick=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{data=JSON.parse(r.result);save();}catch(err){toast("That file isn't valid JSON");}};r.readAsText(f);};
  inp.click();
};
$('rst').onclick=async()=>{const s=await store.get();data=s||structuredClone(DEFAULT);render();toast('Reset');};

(async function init(){
  try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}
  const s=await store.get();if(s)data=s;
  if(!Array.isArray(data.social))data.social=structuredClone(DEFAULT.social);
  render();
  if(location.hash==='#edit')document.body.classList.add('editing');
})();
</script>

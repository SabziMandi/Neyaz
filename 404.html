<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correction — Neyaz Farooquee</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#1a1816; --paper:#faf8f3; --rule:#1a1816; }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; line-height:1.5;
  }
  .sheet { max-width:560px; width:100%; border:2px solid var(--rule); padding:38px 34px; }
  .sheet > .inner { border:1px solid var(--rule); padding:34px 28px; text-align:center; }
  .eyebrow {
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    margin:0 0 22px; font-family:Georgia,serif;
  }
  h1 { font-size:30px; font-weight:400; margin:0 0 6px; letter-spacing:.02em; }
  .rule { border:0; border-top:1px solid var(--rule); margin:20px auto; width:70%; }
  p { font-size:16px; margin:0 0 14px; }
  .small { font-size:14px; font-style:italic; }
  a { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
  .back { display:inline-block; margin-top:22px; font-size:13px;
          letter-spacing:.16em; text-transform:uppercase; text-decoration:none;
          border-bottom:1px solid var(--rule); padding-bottom:3px; }
  @media (max-width:520px) {
    .sheet { padding:22px 18px; } .sheet > .inner { padding:26px 18px; }
    h1 { font-size:24px; }
  }
</style>
</head>
<body>
  <main class="sheet">
    <div class="inner">
      <p class="eyebrow">Corrections</p>
      <h1>This page was never printed</h1>
      <hr class="rule">
      <p>The address you followed doesn&rsquo;t match anything in this edition. It may have been moved, renamed, or mistyped.</p>
      <p class="small">Errors are corrected here as a matter of record.</p>
      <a class="back" href="/">Return to the front page</a>
    </div>
  </main>
</body>
</html>
